<title>Maintenance Intelligente 4.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout : fiche technique d'atelier — barre latérale fixe (sommaire numéroté de la feuille de route), colonne de lecture, projets présentés comme des plaques signalétiques. */
:root {
  --paper: #eef2f3;
  --surface: #ffffff;
  --ink: #17232b;
  --muted: #566670;
  --rule: #d3dbdf;
  --accent: #1d6b52;
  --accent-soft: #e1efe9;
  --on-accent: #ffffff;
  --signal: #a86f00;
  --signal-soft: #f6ecd6;
  --free: #74838c;
  --code-bg: #e6ecee;
  --v1: #007f56; --v2: #b06a00; --v3: #2f6cc4;
  --zA: #d3ebdd; --zB: #e6eecd; --zC: #f5e1bb; --zD: #f2cbc6;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s-1: 0.25rem; --s-2: 0.5rem; --s-3: 0.75rem; --s-4: 1rem; --s-5: 1.5rem; --s-6: 2rem; --s-7: 3rem;
  --side: 17.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f161a; --surface: #162026; --ink: #e2e9ec; --muted: #94a5ae; --rule: #2a3841;
    --accent: #52b892; --accent-soft: #173229; --on-accent: #0b1a14; --signal: #e3ad45; --signal-soft: #33280f;
    --free: #8797a0; --code-bg: #1d2a31; --v1: #2f9f74; --v2: #bd8520; --v3: #5b8fdc; --zA: #1d3a2e; --zB: #2e3a1d; --zC: #3d2f13; --zD: #46211e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f161a; --surface: #162026; --ink: #e2e9ec; --muted: #94a5ae; --rule: #2a3841;
  --accent: #52b892; --accent-soft: #173229; --on-accent: #0b1a14; --signal: #e3ad45; --signal-soft: #33280f;
  --free: #8797a0; --code-bg: #1d2a31; --v1: #2f9f74; --v2: #bd8520; --v3: #5b8fdc; --zA: #1d3a2e; --zB: #2e3a1d; --zC: #3d2f13; --zD: #46211e; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 0.18em; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }

/* Barre latérale */
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--rule); padding-block: var(--s-5); padding-left: max(var(--s-5), env(safe-area-inset-left, 0px)); padding-right: var(--s-5); display: flex; flex-direction: column; gap: var(--s-5); }
.brand { display: grid; gap: var(--s-1); text-decoration: none; color: var(--ink); }
.brand-kicker { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; line-height: 1.02; letter-spacing: 0.01em; text-wrap: balance; }
.brand-name span { color: var(--accent); }
nav { display: grid; gap: var(--s-4); }
.nav-group { display: grid; gap: 2px; }
.nav-label { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-bottom: var(--s-1); }
.nav-link { display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: var(--s-2); align-items: baseline; padding: 0.35rem 0.5rem; border-radius: 4px; color: var(--ink); text-decoration: none; font-size: 0.9rem; line-height: 1.3; }
.nav-link .n { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-link:hover { background: var(--paper); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav-link[aria-current="page"] .n { color: var(--accent); }
.nav-sub { display: grid; gap: 2px; padding-left: 2.1rem; }
.nav-sub .nav-link { grid-template-columns: 3.4rem minmax(0, 1fr); font-size: 0.85rem; padding-left: 0.4rem; }
.side-foot { margin-top: auto; display: grid; gap: var(--s-2); font-size: 0.78rem; color: var(--muted); }
.theme-row { display: flex; gap: var(--s-1); flex-wrap: wrap; }
.theme-row button { font: inherit; font-size: 0.75rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); padding: 0.2rem 0.55rem; border-radius: 999px; cursor: pointer; }
.theme-row button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* Barre mobile */
.topbar { display: none; }

/* Zone principale */
main { min-width: 0; padding-block: var(--s-7); padding-left: max(var(--s-6), env(safe-area-inset-left, 0px)); padding-right: max(var(--s-6), env(safe-area-inset-right, 0px)); }
.page { max-width: 46rem; margin: 0 auto; }
.page.wide { max-width: 64rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 var(--s-2); }

.md h1, .page-title { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.1rem, 4.5vw, 3rem); line-height: 1.02; letter-spacing: 0.005em; margin: 0 0 var(--s-5); text-wrap: balance; }
.md h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6rem; line-height: 1.1; margin: var(--s-7) 0 var(--s-3); padding-top: var(--s-3); border-top: 1px solid var(--rule); text-wrap: balance; }
.md h3 { font-size: 1.05rem; font-weight: 600; margin: var(--s-5) 0 var(--s-2); }
.md p, .md ul, .md ol { margin: 0 0 var(--s-4); }
.md ul, .md ol { padding-left: 1.3rem; }
.md li { margin-bottom: var(--s-1); }
.md li::marker { color: var(--muted); }
.md strong { font-weight: 600; }
.md code { font-family: var(--f-mono); font-size: 0.86em; background: var(--code-bg); padding: 0.08em 0.35em; border-radius: 3px; }
.md pre { background: var(--code-bg); padding: var(--s-4); border-radius: 4px; overflow-x: auto; font-size: 0.85rem; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 var(--s-5); padding: var(--s-3) var(--s-4); background: var(--signal-soft); border-left: 3px solid var(--signal); border-radius: 0 4px 4px 0; font-size: 0.92rem; }
.md blockquote p { margin: 0; }
.table-wrap { overflow-x: auto; margin: 0 0 var(--s-5); border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); }
.md table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.md th, .md td { text-align: left; vertical-align: top; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--rule); }
.md th { font-family: var(--f-mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
.md tr:last-child td { border-bottom: 0; }
.md h4 { font-size: 0.95rem; font-weight: 600; margin: var(--s-4) 0 var(--s-2); color: var(--muted); }

/* Définitions, formules, encadrés */
.defs { display: grid; gap: var(--s-3); margin: 0 0 var(--s-5); padding: var(--s-4) var(--s-5); background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; }
.defs div { display: grid; gap: 2px; }
.defs dt { font-weight: 600; }
.defs dd { margin: 0; color: var(--ink); }
.defs .src { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.eq { font-family: var(--f-mono); font-size: 0.9rem; background: var(--code-bg); border-radius: 4px; padding: var(--s-3) var(--s-4); margin: 0 0 var(--s-4); overflow-x: auto; white-space: pre; line-height: 1.75; }
.key { padding: var(--s-3) var(--s-4); margin: 0 0 var(--s-5); border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 4px 4px 0; }
.key p { margin: 0; }
.refs { font-size: 0.85rem; padding-left: 2.2rem; }
.refs li { margin-bottom: var(--s-2); }

/* Figures (SVG inline, couleurs par jetons) */
.fig { margin: var(--s-5) 0 var(--s-6); }
.fig-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: var(--s-3); overflow-x: auto; }
.fig svg { display: block; width: 100%; height: auto; min-width: 30rem; }
.fig figcaption { font-size: 0.82rem; color: var(--muted); margin-top: var(--s-2); line-height: 1.5; }
.fig svg text { font-family: var(--f-body); }
.fig .grid { stroke: var(--rule); stroke-width: 1; }
.fig .axis, .fig .tickl { stroke: var(--muted); stroke-width: 1.2; }
.fig .tick { fill: var(--muted); font-size: 11px; }
.fig .axt { fill: var(--ink); font-size: 12px; font-weight: 500; }
.fig .lbl { fill: var(--ink); font-size: 11.5px; }
.fig .zone { fill: var(--muted); font-size: 11px; font-family: var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; }
.fig .ln { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.fig .c1 { stroke: var(--accent); }
.fig .c2 { stroke: var(--signal); }
.fig .c3 { stroke: var(--ink); }
.fig .dash { stroke-dasharray: 6 5; }
.fig .mark { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
.fig .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.fig .pt.bad { fill: var(--signal); }
.fig .band { fill: var(--accent); fill-opacity: 0.14; stroke: none; }
.fig .up { fill: var(--accent); }
.fig .good { fill: var(--accent); fill-opacity: 0.7; }
.fig .down, .fig .loss { fill: var(--signal); }
.fig .loss { fill-opacity: 0.55; }
.fig .bartxt { fill: var(--on-accent); font-size: 11.5px; font-weight: 500; }
.fig .bx { fill: var(--surface); stroke: var(--ink); stroke-width: 1.3; }
.fig .bx.strong { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
.fig .bx.soft { fill: var(--paper); stroke: var(--rule); }
.fig .bxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
.fig .bxs { fill: var(--muted); font-size: 10.5px; }
.fig .arr, .fig .arrp, .fig .arc { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.fig .arc { stroke: var(--accent); stroke-width: 3; }
.fig .ahp { fill: var(--muted); }
.fig .wire { stroke: var(--muted); stroke-width: 1.4; }
.fig .st { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.8; }
.fig .st.bad { fill: var(--signal-soft); stroke: var(--signal); }
.fig .st.soft { fill: var(--paper); stroke: var(--rule); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-4); margin-top: var(--s-7); padding-top: var(--s-5); border-top: 1px solid var(--rule); }
.pager a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); padding: var(--s-3) var(--s-4); border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager .dir { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pager .next { text-align: right; grid-column: 2; }

/* Plaques projets */
.plates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); margin-top: var(--s-5); }
.plate { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; text-decoration: none; color: var(--ink); min-width: 0; transition: border-color .15s, transform .15s; }
.plate:hover { border-color: var(--accent); transform: translateY(-2px); }
.plate-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-4); border-bottom: 1px solid var(--rule); font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.06em; }
.rivet { display: inline-flex; gap: 5px; }
.rivet i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); display: block; }
.plate-body { padding: var(--s-4); display: grid; gap: var(--s-3); flex: 1; align-content: start; }
.plate-title { font-family: var(--f-display); font-weight: 600; font-size: 1.4rem; line-height: 1.08; margin: 0; text-wrap: balance; }
.specs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.3rem var(--s-3); margin: 0; font-size: 0.84rem; }
.specs dt { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 0.15rem; }
.specs dd { margin: 0; }
.plate-foot { padding: var(--s-3) var(--s-4); border-top: 1px dashed var(--rule); font-size: 0.8rem; color: var(--muted); }
.plate.free { border-style: dashed; background: transparent; }
.plate.free .plate-body { place-content: center; text-align: center; min-height: 13rem; }
.plate.free .plate-title { color: var(--free); }
.plate.free p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.1rem 0.55rem; border-radius: 999px; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.04em; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.en_cours { background: var(--signal-soft); color: var(--signal); }
.pill.termine { background: var(--accent-soft); color: var(--accent); }
.pill.a_venir, .pill.libre { background: var(--paper); color: var(--free); }
.tags { display: flex; flex-wrap: wrap; gap: var(--s-1); }
.tag { font-size: 0.74rem; padding: 0.05rem 0.5rem; border: 1px solid var(--rule); border-radius: 3px; color: var(--muted); }

/* Fiche projet */
.proj-head { display: grid; gap: var(--s-3); padding-bottom: var(--s-5); margin-bottom: var(--s-5); border-bottom: 2px solid var(--ink); }
.proj-head .page-title { margin: 0; }
.proj-sub { font-size: 1.1rem; color: var(--muted); margin: 0; max-width: 40rem; }
.proj-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: var(--s-3) var(--s-5); margin: var(--s-3) 0 0; }
.proj-meta div { display: grid; gap: 2px; min-width: 0; }
.proj-meta dt { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.proj-meta dd { margin: 0; font-size: 0.92rem; }
.resume { font-size: 1.02rem; margin: 0 0 var(--s-5); }
.linklist { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: 0 0 var(--s-5); padding: 0; list-style: none; }
.linklist a { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.75rem; border: 1px solid var(--rule); border-radius: 4px; text-decoration: none; background: var(--surface); font-size: 0.88rem; }
.linklist a:hover { border-color: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 0.4rem; font: inherit; font-size: 0.9rem; font-weight: 500; padding: 0.5rem 1rem; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }

/* Emplacement libre */
.steps { display: grid; gap: var(--s-3); counter-reset: st; padding: 0; margin: 0 0 var(--s-6); list-style: none; }
.steps li { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: var(--s-3); align-items: start; }
.steps li::before { counter-increment: st; content: counter(st); font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; line-height: 1.5rem; width: 2rem; height: 2rem; display: grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 50%; }
.form { display: grid; gap: var(--s-3); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: var(--s-5); }
.form h2 { margin: 0; border: 0; padding: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.field { display: grid; gap: var(--s-1); min-width: 0; }
.field label { font-size: 0.82rem; font-weight: 500; }
.field .hint { font-size: 0.76rem; color: var(--muted); }
.field input, .field textarea, .field select { font: inherit; font-size: 0.92rem; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 0.5rem 0.6rem; width: 100%; }
.field textarea { min-height: 5rem; resize: vertical; }
.out { font-family: var(--f-mono); font-size: 0.8rem; background: var(--code-bg); border-radius: 4px; padding: var(--s-4); overflow-x: auto; white-space: pre; margin: 0; max-height: 22rem; }
.out-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s-2); }
.status-msg { font-size: 0.84rem; color: var(--accent); min-height: 1.2em; }

.notice { padding: var(--s-4); border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); }
.notice code { font-family: var(--f-mono); font-size: 0.86em; }
.loading { color: var(--muted); font-family: var(--f-mono); font-size: 0.85rem; }

/* Figures */
.fig { margin: var(--s-5) 0 var(--s-6); padding: var(--s-4); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; }
@media (max-width: 900px) { .g-outils { position: static; } }
@media (max-width: 640px) { .md table { min-width: 34rem; } .fig svg { min-width: 34rem; } .fig figcaption { position: sticky; left: 0; max-width: calc(100vw - 4rem); } }
.fig svg { display: block; width: 100%; height: auto; max-width: 100%; min-width: 0; overflow: visible; }
.fig figcaption { margin-top: var(--s-3); font-size: 0.82rem; color: var(--muted); line-height: 1.45; }
.fig-img img { display: block; width: 100%; height: auto; border-radius: 4px; background: #ffffff; }
.fig-img { overflow-x: visible; }
.fig text { font-family: var(--f-body); font-size: 12px; fill: var(--ink); }
.fig .tb { font-weight: 600; } .fig .tm { fill: var(--muted); font-size: 11.5px; } .fig .ts { font-size: 10.5px; } .fig .tg { font-size: 9px; font-weight: 600; }
.fig .tz { font-family: var(--f-mono); font-weight: 500; } .fig .tbw { font-weight: 600; fill: var(--surface); }
.fig .ax { stroke: var(--muted); stroke-width: 1; fill: none; } .fig .gr { stroke: var(--rule); stroke-width: 1; fill: none; }
.fig .ln { stroke: var(--muted); stroke-width: 1.4; fill: none; } .fig .dash { stroke-dasharray: 4 4; }
.fig .arw { stroke: var(--muted); stroke-width: 1.5; fill: none; } .fig .arh { fill: var(--muted); }
.fig .dim { stroke: var(--muted); stroke-width: 1; fill: none; }
.fig .bx { fill: var(--paper); stroke: var(--rule); stroke-width: 1.2; } .fig .bx.acc { fill: var(--accent-soft); stroke: var(--accent); }
.fig .bx.sig { fill: var(--signal-soft); stroke: var(--signal); } .fig .bx.strong { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.fig .bx.dash { fill: none; stroke-dasharray: 4 4; }
.fig .c1, .fig .c2, .fig .c3 { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.fig .c1 { stroke: var(--v1); } .fig .c2 { stroke: var(--v2); } .fig .c3 { stroke: var(--v3); } .fig .thick { stroke-width: 2.6; } .fig .dashed { stroke-dasharray: 6 4; }
.fig .dot { fill: var(--v1); stroke: var(--surface); stroke-width: 2; } .fig .dot2 { fill: var(--v3); stroke: var(--surface); stroke-width: 2; }
.fig .dotP { fill: var(--v2); stroke: var(--surface); stroke-width: 2; } .fig .dotF { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.fig .gate { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; } .fig .basic { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.fig .state { stroke-width: 1.6; } .fig .state.up { fill: var(--accent-soft); stroke: var(--accent); } .fig .state.dn { fill: var(--signal-soft); stroke: var(--signal); }
.fig .roof { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  "use strict";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function getJSON(url) {

  }
  function getText(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(url + " : " + r.status); return r.text(); });
  }
  function md(text) {
    var html;
    if (window.marked && typeof window.marked.parse === "function") {
      html = window.marked.parse(text, { gfm: true });
    } else {
      html = "<pre>" + esc(text) + "</pre>";
    }
    var box = document.createElement("div");
    box.innerHTML = html;
    box.querySelectorAll("table").forEach(function (t) {
      var w = document.createElement("div"); w.className = "table-wrap";
      t.parentNode.insertBefore(w, t); w.appendChild(t);

    box.querySelectorAll("a[href^='http']").forEach(function (a) { a.target = "_blank"; a.rel = "noopener"; });
    return box.innerHTML;
  }

  /* Thème */
  function applyTheme(t) {

    document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-set") === t)); });
    try { localStorage.setItem("pf-theme", t); } catch (e) {}
  }
  document.querySelectorAll("[data-theme-set]").forEach(function (b) {
    b.addEventListener("click", function () { applyTheme(b.getAttribute("data-theme-set")); });
  });
  try { var saved = localStorage.getItem("pf-theme"); if (saved) applyTheme(saved); } catch (e) {}

  /* Menu mobile */
  function setMenu(open) {
    side.setAttribute("data-open", String(open));
    menuBtn.setAttribute("aria-expanded", String(open));
    syncMenu();
  }
  function syncMenu() {
    var mobile = window.matchMedia("(max-width: 900px)").matches;
    side.hidden = mobile && side.getAttribute("data-open") !== "true";
  }
  menuBtn.addEventListener("click", function () { setMenu(side.getAttribute("data-open") !== "true"); });
  window.addEventListener("resize", syncMenu);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });
  syncMenu();

  /* Navigation */
  function buildNav() {
    var s = state.sommaire;
    var out = "";
    state.pages = [];
    s.groupes.forEach(function (g) {
      out += '<div class="nav-group"><div class="nav-label">' + esc(g.nom) + "</div>";
      g.pages.forEach(function (p) {
        state.pages.push(p);
        out += '<a class="nav-link" href="#' + esc(p.id) + '" data-id="' + esc(p.id) + '"><span class="n">' + esc(p.num || "·") + "</span><span>" + esc(p.titre) + "</span></a>";
        if (p.special === "projets" && state.projets) {
          out += '<div class="nav-sub">';
          state.projets.emplacements.forEach(function (e) {
            out += '<a class="nav-link" href="#' + esc(e.id) + '" data-id="' + esc(e.id) + '"><span class="n">' + esc(e.repere) + "</span><span>" + esc(e.libre ? "Emplacement libre" : shortTitle(e.titre)) + "</span></a>";
          });
          out += "</div>";
        }
      });
      out += "</div>";
    });
    document.getElementById("nav").innerHTML = out;
    document.getElementById("brand-kicker").textContent = s.sous_titre || "Portfolio numérique";
    document.getElementById("foot-etab").textContent = [s.etablissement, s.annee].filter(Boolean).join(" · ");
  }
  function shortTitle(t) { t = String(t || ""); return t.length > 42 ? t.slice(0, 40).trim() + "…" : t; }
  function markNav(id) {
    document.querySelectorAll(".nav-link").forEach(function (a) {
      if (a.getAttribute("data-id") === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }

  function pager(id) {
    var order = [];
    state.pages.forEach(function (p) {
      order.push({ id: p.id, titre: p.titre });
      if (p.special === "projets" && state.projets) state.projets.emplacements.forEach(function (e) { order.push({ id: e.id, titre: e.libre ? e.repere + " · Emplacement libre" : e.repere + " · " + shortTitle(e.titre) }); });
    });
    var i = order.findIndex(function (o) { return o.id === id; });
    if (i < 0) return "";
    var prev = order[i - 1], next = order[i + 1], h = '<nav class="pager" aria-label="Pages voisines">';
    if (prev) h += '<a class="prev" href="#' + esc(prev.id) + '"><span class="dir">Précédent</span><span>' + esc(prev.titre) + "</span></a>";
    if (next) h += '<a class="next" href="#' + esc(next.id) + '"><span class="dir">Suivant</span><span>' + esc(next.titre) + "</span></a>";
    return h + "</nav>";
  }

  function show(html, wide) {

  /* Rendus */
  function renderSection(p) {

  }

  function plate(e) {

      "</div>" + (e.equipe && e.equipe.length ? '<div class="plate-foot">' + esc(e.equipe.join(" · ")) + "</div>" : "") + "</a>";
  }
  function spec(k, v) { return v ? "<dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd>" : ""; }

  function renderProjets() {
    var em = state.projets.emplacements;
    var libres = em.filter(function (e) { return e.libre; }).length;
    show('<p class="eyebrow">Projets</p><h1 class="page-title">Les projets</h1>' +
      '<div class="md"><p>Chaque binôme de l\'équipe, ainsi qu\'un membre en individuel, mène un projet technique en lien avec la maintenance ou la prédiction des défaillances. ' +
      (libres ? libres + (libres > 1 ? " emplacements sont libres et accueilleront" : " emplacement est libre et accueillera") + " les projets dès qu'ils seront prêts." : "Tous les projets sont en place.") + "</p></div>" +
      '<div class="plates">' + em.map(plate).join("") + "</div>" + pager("projets"), true);
  }

  function renderProjet(e) {
    if (e.libre) return renderLibre(e);
    var head = '<header class="proj-head"><div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap"><span class="eyebrow" style="margin:0">' + esc(e.repere) + '</span><span class="pill ' + esc(e.statut) + '">' + esc(STATUTS[e.statut] || e.statut) + "</span></div>" +
      '<h1 class="page-title">' + esc(e.titre) + "</h1>" + (e.sous_titre ? '<p class="proj-sub">' + esc(e.sous_titre) + "</p>" : "") +
      '<dl class="proj-meta">' + meta("Équipe", (e.equipe || []).join(", ")) + meta("Équipement", e.equipement) + meta("Tâche", e.tache) + meta("Données", e.donnees) + meta("Outils", (e.outils || []).join(", ")) + "</dl></header>";
    var links = (e.lien_projet ? [{ label: "Ouvrir le projet", url: e.lien_projet }] : []).concat(e.liens || []);
    var linkHtml = links.length ? '<ul class="linklist">' + links.map(function (l) { return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + " ↗</a></li>"; }).join("") + "</ul>" : "";
    var files = (e.fichiers || []);
    var fileHtml = files.length ? '<div class="md"><h2>Fichiers du projet</h2></div><ul class="linklist">' + files.map(function (f) { return '<li><a href="' + esc(f.chemin) + '" target="_blank" rel="noopener">' + esc(f.label) + "</a></li>"; }).join("") + "</ul>" : "";
    var top = head + (e.resume ? '<p class="resume">' + esc(e.resume) + "</p>" : "") + linkHtml;
    if (!e.page) { show(top + fileHtml + pager(e.id), false); return; }
    show(top + '<p class="loading">Chargement de la fiche…</p>');
    getText(e.page).then(function (t) { show(top + '<article class="md">' + md(t) + "</article>" + fileHtml + pager(e.id)); }).catch(fail);
  }
  function meta(k, v) { return v ? "<div><dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd></div>" : ""; }

  function renderLibre(e) {
    var dossier = "projets/" + e.id + "/";
    show('<p class="eyebrow">' + esc(e.repere) + ' · <span class="pill libre">Libre</span></p><h1 class="page-title">Emplacement libre</h1>' +
      (e.equipe && e.equipe.length ? '<p class="proj-sub">Réservé au projet de : ' + esc(e.equipe.join(", ")) + "</p>" : "") +
      '<div class="md"><p>Cet emplacement accueillera un projet terminé de l\'équipe. L\'ajout se fait en trois étapes, sans toucher au code du site.</p></div>' +
      '<ol class="steps">' +
      "<li><div><strong>Déposer les fichiers</strong> du projet dans le dossier <code>" + esc(dossier) + "</code> : fiche <code>index.md</code>, rapport PDF, images, archive du code.</div></li>" +
      "<li><div><strong>Préparer la fiche</strong> avec le formulaire ci-dessous, puis copier le bloc obtenu à la place de celui de " + esc(e.repere) + " dans <code>projets/projets.json</code>.</div></li>" +
      "<li><div><strong>Vérifier</strong> la page en local (Live Server dans VS Code, ou <code>python -m http.server</code>), puis publier.</div></li>" +
      "</ol>" +
      '<form class="form" id="f-proj" novalidate>' +
      '<div class="md"><h2>Préparer la fiche</h2></div>' +
      field("f-titre", "Titre du projet", "input", "Exemple : Analyse de fiabilité d'un parc de compresseurs") +
      field("f-sous", "Sous-titre ou question posée", "input", "") +
      '<div class="row2">' + field("f-equipe", "Équipe", "input", "Noms séparés par des virgules") +
      '<div class="field"><label for="f-statut">Statut</label><select id="f-statut"><option value="termine">Terminé</option><option value="en_cours">En cours</option><option value="a_venir">À venir</option></select></div></div>' +
      '<div class="row2">' + field("f-equip", "Équipement étudié", "input", "") + field("f-tache", "Tâche", "input", "Détection, diagnostic, fiabilité, RUL…") + "</div>" +
      '<div class="row2">' + field("f-donnees", "Données", "input", "Nom du dataset, organisme, licence") + field("f-outils", "Outils", "input", "Séparés par des virgules") + "</div>" +
      field("f-mots", "Mots-clés", "input", "Séparés par des virgules") +
      field("f-resume", "Résumé", "textarea", "Deux ou trois phrases") +
      '<div class="row2">' + field("f-lien", "Lien du projet publié (facultatif)", "input", "https://…") +
      '<div class="field"><label for="f-page">Fiche index.md déposée ?</label><select id="f-page"><option value="oui">Oui</option><option value="non">Non</option></select></div></div>' +
      '<div class="out-bar"><strong style="font-size:.88rem">Bloc à coller dans projets.json</strong><button class="btn" type="button" id="f-copy">Copier</button></div>' +
      '<pre class="out" id="f-out" tabindex="0"></pre><div class="status-msg" id="f-msg" role="status"></div>' +
      "</form>" + pager(e.id));

    var ids = ["f-titre", "f-sous", "f-equipe", "f-statut", "f-equip", "f-tache", "f-donnees", "f-outils", "f-mots", "f-resume", "f-lien", "f-page"];
    function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }
    function list(id) { return val(id).split(",").map(function (x) { return x.trim(); }).filter(Boolean); }
    function build() {
      var o = { id: e.id, repere: e.repere, libre: false, statut: val("f-statut"), titre: val("f-titre") || "(titre)", sous_titre: val("f-sous"), equipe: list("f-equipe"), equipement: val("f-equip"), tache: val("f-tache"), donnees: val("f-donnees"), outils: list("f-outils"), mots_cles: list("f-mots"), resume: val("f-resume") };
      if (val("f-page") === "oui") o.page = dossier + "index.md";
      if (val("f-lien")) o.lien_projet = val("f-lien");
      o.liens = []; o.fichiers = [];
      Object.keys(o).forEach(function (k) { if (o[k] === "" ) delete o[k]; });
      document.getElementById("f-out").textContent = JSON.stringify(o, null, 2);
    }
    if (e.equipe && e.equipe.length) document.getElementById("f-equipe").value = e.equipe.join(", ");
    ids.forEach(function (id) { var el = document.getElementById(id); if (el) el.addEventListener("input", build); });
    document.getElementById("f-proj").addEventListener("submit", function (ev) { ev.preventDefault(); });
    document.getElementById("f-copy").addEventListener("click", function () {
      var out = document.getElementById("f-out"), msg = document.getElementById("f-msg");
      function selectIt() { var r = document.createRange(); r.selectNodeContents(out); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "Texte sélectionné : copiez-le avec Ctrl+C."; }
      try {
        navigator.clipboard.writeText(out.textContent).then(function () { msg.textContent = "Bloc copié."; }, selectIt);
      } catch (err) { selectIt(); }
    });
    build();
  }
  function field(id, label, kind, hint) {
    var ctl = kind === "textarea" ? '<textarea id="' + id + '"></textarea>' : '<input id="' + id + '" type="text">';
    return '<div class="field"><label for="' + id + '">' + esc(label) + "</label>" + ctl + (hint ? '<span class="hint">' + esc(hint) + "</span>" : "") + "</div>";
  }

  /* ---------- Glossaire, termes cliquables, citations ---------- */
  function preparerGlossaire(liste) {
    state.gloss = liste || [];
    state.glossById = {};
    var formes = [];
    state.gloss.forEach(function (t) {
      state.glossById[t.id] = t;
      (t.formes || []).forEach(function (f) { formes.push({ f: f, id: t.id }); });
    });
    formes.sort(function (x, y) { return y.f.length - x.f.length; });
    state.glossForme = {};
    formes.forEach(function (x) { state.glossForme[x.f.toLowerCase()] = x.id; });
    if (!formes.length) { state.glossRe = null; return; }
    var alt = formes.map(function (x) { return x.f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|");
    try { state.glossRe = new RegExp("(?<![\\p{L}\\p{N}])(" + alt + ")(?![\\p{L}\\p{N}])", "giu"); }
    catch (e) { state.glossRe = new RegExp("(^|[^A-Za-zÀ-ÿ0-9])(" + alt + ")(?![A-Za-zÀ-ÿ0-9])", "gi"); state.glossCompat = true; }
  }

  var EXCLUS = "a, button, code, pre, h1, h2, h3, h4, figure, svg, th, .refs, .g-entry, .proj-head, .eyebrow, label";

  function lierTermes(racine, pageId) {
    if (!state.glossRe) return;
    var vus = {};
    var walker = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        return n.parentElement && n.parentElement.closest(EXCLUS) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      }
    });
    var noeuds = [];
    while (walker.nextNode()) noeuds.push(walker.currentNode);
    noeuds.forEach(function (n) {
      var txt = n.nodeValue, re = state.glossRe, m, dernier = 0, frag = null;
      re.lastIndex = 0;
      while ((m = re.exec(txt))) {
        var mot = state.glossCompat ? m[2] : m[1];
        var debut = state.glossCompat ? m.index + m[1].length : m.index;
        var id = state.glossForme[mot.toLowerCase()];
        if (!id || vus[id]) continue;
        vus[id] = true;
        frag = frag || document.createDocumentFragment();
        frag.appendChild(document.createTextNode(txt.slice(dernier, debut)));
        var b = document.createElement("button");
        b.type = "button"; b.className = "gl"; b.setAttribute("data-g", id);
        b.setAttribute("aria-haspopup", "dialog");
        b.textContent = mot;
        frag.appendChild(b);
        dernier = debut + mot.length;
      }
      if (frag) {
        frag.appendChild(document.createTextNode(txt.slice(dernier)));
        n.parentNode.replaceChild(frag, n);
      }
    });
  }

  function lierCitations(racine) {
    var refs = racine.querySelectorAll("ol.refs > li");
    if (!refs.length) return;
    refs.forEach(function (li) {
      var m = li.textContent.match(/^\s*\[(\d+)\]/);
      if (m) li.id = "ref-" + m[1];
    });
    var walker = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        if (!/\[\d+\]/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        return n.parentElement.closest("a, button, code, pre, .refs, figure") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
      }
    });
    var noeuds = [];
    while (walker.nextNode()) noeuds.push(walker.currentNode);
    noeuds.forEach(function (n) {
      var parts = n.nodeValue.split(/(\[\d+\])/), frag = document.createDocumentFragment();
      parts.forEach(function (p) {
        var m = p.match(/^\[(\d+)\]$/);
        if (m && racine.querySelector("#ref-" + m[1])) {
          var a = document.createElement("a");
          a.href = "#"; a.className = "cite"; a.setAttribute("data-ref", m[1]); a.textContent = p;
          a.title = "Voir la référence " + m[1];
          frag.appendChild(a);
        } else frag.appendChild(document.createTextNode(p));
      });
      n.parentNode.replaceChild(frag, n);
    });
  }

  function enrichir() {
    var pageId = state.pageCourante;
    main.querySelectorAll("article.md").forEach(function (art) {
      lierCitations(art);
      if (pageId !== "glossaire") lierTermes(art, pageId);
    });
    if (state.ancre) {
      var cible = document.getElementById("g-" + state.ancre) || document.getElementById(state.ancre);
      state.ancre = null;
      if (cible) {
        cible.classList.add("flash");
        setTimeout(function () { cible.scrollIntoView({ block: "start" }); }, 30);
      }
    }
  }

  /* Bulle d'explication */
  var bulle = document.createElement("div");
  bulle.className = "bulle"; bulle.hidden = true; bulle.setAttribute("role", "dialog");
  document.body.appendChild(bulle);
  var bulleSource = null;

  function titrePage(id) {
    var p = state.pages.find(function (x) { return x.id === id; });
    if (p) return (p.num ? (/^[A-Z]$/.test(p.num) ? "Annexe " : "Section ") + p.num + " · " : "") + p.titre;
    var e = state.projets && state.projets.emplacements.find(function (x) { return x.id === id; });
    return e ? e.repere + " · " + shortTitle(e.titre) : id;
  }

  function liensTerme(t, avecGlossaire) {
    var l = [];
    if (avecGlossaire) l.push('<a href="#glossaire.' + esc(t.id) + '">Glossaire</a>');
    if (t.page && t.page !== state.pageCourante) l.push('<a href="#' + esc(t.page) + '">' + esc(titrePage(t.page)) + "</a>");
    if (t.video) l.push('<a href="' + esc(t.video.url) + '" target="_blank" rel="noopener">▶ Vidéo (' + esc(t.video.langue) + ")</a>");
    if (t.wiki) l.push('<a href="' + esc(t.wiki) + '" target="_blank" rel="noopener">Wikipédia ↗</a>');
    return l.join("");
  }

  function ouvrirBulle(btn) {
    var t = state.glossById[btn.getAttribute("data-g")];
    if (!t) return;
    bulle.innerHTML = '<button type="button" class="bulle-x" aria-label="Fermer">×</button>' +
      '<p class="bulle-t">' + esc(t.terme) + (t.en && t.en !== t.terme ? ' <span>' + esc(t.en) + "</span>" : "") + "</p>" +
      '<p class="bulle-d">' + esc(t.definition) + "</p>" +
      '<p class="bulle-l">' + liensTerme(t, true) + "</p>";
    bulle.hidden = false;
    bulleSource = btn;
    btn.setAttribute("aria-expanded", "true");
    var r = btn.getBoundingClientRect(), mobile = window.innerWidth < 640;
    if (mobile) { bulle.classList.add("bas"); bulle.style.left = ""; bulle.style.top = ""; }
    else {
      bulle.classList.remove("bas");
      var w = bulle.offsetWidth, x = Math.min(Math.max(12, r.left + window.scrollX), window.scrollX + document.documentElement.clientWidth - w - 12);
      var y = r.bottom + window.scrollY + 8;
      if (r.bottom + bulle.offsetHeight + 16 > window.innerHeight) y = r.top + window.scrollY - bulle.offsetHeight - 8;
      bulle.style.left = x + "px"; bulle.style.top = y + "px";
    }
    bulle.querySelector(".bulle-x").focus({ preventScroll: true });
  }
  function fermerBulle() {
    if (bulle.hidden) return;
    bulle.hidden = true;
    if (bulleSource) { bulleSource.setAttribute("aria-expanded", "false"); bulleSource = null; }
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button.gl");
    if (b) { e.preventDefault(); if (bulleSource === b) fermerBulle(); else ouvrirBulle(b); return; }
    var c = e.target.closest && e.target.closest("a.cite");
    if (c) {
      e.preventDefault();
      var li = document.getElementById("ref-" + c.getAttribute("data-ref"));
      if (li) { li.scrollIntoView({ block: "center" }); li.classList.remove("flash"); void li.offsetWidth; li.classList.add("flash"); }
      return;
    }
    if (e.target.closest && e.target.closest(".bulle-x")) { var s = bulleSource; fermerBulle(); if (s) s.focus(); return; }
    if (!bulle.hidden && !bulle.contains(e.target)) fermerBulle();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !bulle.hidden) { var s = bulleSource; fermerBulle(); if (s) s.focus(); } });
  window.addEventListener("resize", fermerBulle);

  /* Page Glossaire */
  function renderGlossaire(p) {
    var liste = state.gloss.slice().sort(function (a, b) { return a.terme.localeCompare(b.terme, "fr", { sensitivity: "base" }); });
    var lettres = {}, html = "";
    liste.forEach(function (t) {
      var L = t.terme.normalize("NFD").replace(/[̀-ͯ]/g, "").charAt(0).toUpperCase();
      if (/[0-9]/.test(L)) L = "#";
      (lettres[L] = lettres[L] || []).push(t);
    });
    var cles = Object.keys(lettres).sort();
    html += '<p class="eyebrow">Annexe ' + esc(p.num) + '</p><article class="md"><h1>Glossaire</h1>' +
      "<p>" + liste.length + " termes techniques du portfolio, avec leur équivalent anglais. Dans les pages, chaque terme du glossaire est souligné en pointillés : un clic affiche sa définition. Les liens « Vidéo » mènent à des explications sélectionnées par l'équipe.</p></article>" +
      '<div class="g-outils"><label for="g-search" class="g-label">Rechercher un terme</label><input id="g-search" type="search" placeholder="ex. MTBF, Weibull, cavitation" autocomplete="off">' +
      '<nav class="g-lettres" aria-label="Lettres">' + cles.map(function (L) { return '<a href="#glossaire.L-' + (L === "#" ? "0" : L) + '">' + L + "</a>"; }).join("") + "</nav></div>" +
      '<p class="g-vide" id="g-vide" hidden>Aucun terme ne correspond à cette recherche.</p>';
    cles.forEach(function (L) {
      html += '<section class="g-groupe" id="L-' + (L === "#" ? "0" : L) + '"><h2 class="g-lettre">' + L + "</h2>";
      lettres[L].forEach(function (t) {
        html += '<div class="g-entry" id="g-' + esc(t.id) + '" data-q="' + esc((t.terme + " " + t.en + " " + (t.formes || []).join(" ")).toLowerCase()) + '">' +
          '<h3>' + esc(t.terme) + (t.en && t.en !== t.terme ? ' <span class="g-en">' + esc(t.en) + "</span>" : "") + "</h3>" +
          "<p>" + esc(t.definition) + "</p>" + '<p class="g-liens">' + liensTerme(t, false) + "</p></div>";
      });
      html += "</section>";
    });
    show(html + pager(p.id));
    var input = document.getElementById("g-search");
    input.addEventListener("input", function () {
      var q = input.value.trim().toLowerCase(), n = 0;
      document.querySelectorAll(".g-entry").forEach(function (el) { var ok = !q || el.getAttribute("data-q").indexOf(q) >= 0; el.hidden = !ok; if (ok) n++; });
      document.querySelectorAll(".g-groupe").forEach(function (g) { g.hidden = !g.querySelector(".g-entry:not([hidden])"); });
      document.getElementById("g-vide").hidden = n > 0;
    });
  }

  function fail(err) {
    show('<h1 class="page-title">Page indisponible</h1><div class="notice md"><p>Le fichier de contenu n\'a pas pu être chargé (' + esc(err && err.message) + ").</p>" +
      "<p>Si le site est ouvert directement depuis le disque, lancez un serveur local à la racine du dossier : extension <strong>Live Server</strong> dans VS Code, ou <code>python -m http.server</code>, puis ouvrez <code>http://localhost:8000</code>.</p></div>");
  }

  function route() {
    var brut = (location.hash || "").replace(/^#/, "") || "accueil";
    var point = brut.indexOf(".");
    var id = point > 0 ? brut.slice(0, point) : brut;
    state.ancre = point > 0 ? brut.slice(point + 1) : null;
    state.pageCourante = id;
    setMenu(false);
    markNav(id);
    if (id === "glossaire") { var pg = state.pages.find(function (x) { return x.id === "glossaire"; }); if (pg) return renderGlossaire(pg); }
    if (id === "projets") return renderProjets();
    var e = state.projets && state.projets.emplacements.find(function (x) { return x.id === id; });
    if (e) return renderProjet(e);
    var p = state.pages.find(function (x) { return x.id === id; });
    if (p && p.fichier) return renderSection(p);
    markNav("accueil");
    renderSection(state.pages[0]);
  }

  Promise.all([getJSON("contenu/sommaire.json"), getJSON("projets/projets.json"),
               getJSON("contenu/glossaire.json").catch(function () { return []; })]).then(function (r) {
    state.sommaire = r[0]; state.projets = r[1];
    preparerGlossaire(r[2]);
    buildNav();
    window.addEventListener("hashchange", function () { route(); main.focus({ preventScroll: true }); });
    route();
  }).catch(fail);
})();
</script>
